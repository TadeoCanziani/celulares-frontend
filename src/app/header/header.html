<header class="catalog-header">
  <div class="banner-container">
    <img class="banner" src="banner.png" alt="Teléfonos celulares de distintas generaciones">
    <nav class="header-nav" aria-label="Navegación principal">
      <a
        class="header-button"
        routerLink="/celulares"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
      >Celulares</a>
      <a
        class="header-button"
        routerLink="/marcas"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >Marcas</a>
      <a
        class="header-button"
        routerLink="/acerca-de"
        routerLinkActive="active"
        ariaCurrentWhenActive="page"
      >Acerca de</a>
    </nav>
  </div>
</header>
