<div class="card">
  <div class="card-body">
    <h5 class="card-title">Celulares</h5>
    <div class="mb-2">
      <label class="form-label">Nombre</label>
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Ej. Galaxy" [value]="filtro.nombre ?? ''"
          (input)="filtro.nombre = $any($event.target).value">
        <button class="btn btn-outline-secondary" type="button" aria-label="Limpiar búsqueda" title="Limpiar búsqueda"
          (click)="limpiar()">×</button>
      </div>
    </div>
    <div class="mb-2">
      <label class="form-label">Memoria RAM</label>
      <div class="input-group">
        <input type="text" class="form-control" placeholder="Ej. 8GB" [value]="filtro.memoriaRam ?? ''"
          (input)="filtro.memoriaRam = $any($event.target).value">
        <button class="btn btn-outline-secondary" type="button" aria-label="Limpiar búsqueda" title="Limpiar búsqueda"
          (click)="limpiar()">×</button>
      </div>
    </div>
    <div class="mb-3">
  <label class="form-label">Marca</label>
  <select class="form-select" (change)="filtro.marcaId = $any($event.target).value">
    <option value="">Todas las marcas</option>
    @for (marca of marcas(); track marca.id) {
      <option [value]="marca.id">{{ marca.nombre }}</option>
    }
  </select>
</div>
    <div class="d-grid gap-2">
  <button class="btn btn-catalog-primary" type="button" (click)="buscar()">Buscar</button>
  <button class="btn btn-catalog-outline" type="button" (click)="mostrarCelulares()">Mostrar celulares</button>
  <button class="btn btn-catalog-primary" type="button" (click)="crearNuevo()">Agregar celular</button>
    </div>
  </div>
</div>

<div class="card mt-3">
  <div class="card-body">
    <h5 class="card-title">Marcas</h5>
    <div class="d-grid gap-2">
      <button class="btn btn-catalog-outline" type="button" (click)="mostrarMarcas()">Mostrar marcas</button>
      <button class="btn btn-catalog-primary" type="button" (click)="agregarMarca()">Agregar marca</button>
    </div>
  </div>
</div>
